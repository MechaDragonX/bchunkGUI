name: Build macOS Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Directs all run commands to execute inside your python subfolder
defaults:
  run:
    working-directory: ./bchunkGUI

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller dearpygui crossfiledialog
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build macOS executable with PyInstaller
      run: |
        pyinstaller --onefile --noconsole --target-arch universal2 bchunkgui.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bchunkgui-macos
        # Path relative to repository root
        path: bchunkGUI/dist/bchunkgui
  